<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RustCraft</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #game { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
    #hud {
      position: fixed; top: 8px; left: 8px; z-index: 10;
      font: 13px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      color: #fff; background: rgba(0, 0, 0, 0.45); padding: 6px 10px;
      border-radius: 6px; pointer-events: none; white-space: pre;
    }
    #crosshair {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 10; color: rgba(255, 255, 255, 0.9); font: 20px ui-monospace, monospace;
      pointer-events: none; text-shadow: 0 0 2px rgba(0,0,0,0.8);
    }
    #overlay {
      position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.55); color: #fff;
      font: 15px/1.7 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      text-align: center; cursor: pointer;
    }
    #overlay .box { background: rgba(20, 24, 32, 0.92); padding: 24px 36px; border-radius: 12px; box-shadow: 0 8px 40px rgba(0,0,0,0.5); }
    #overlay h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: 2px; }
    #overlay p { margin: 4px 0; opacity: 0.85; }
    #overlay .seed { opacity: 0.6; font-size: 12px; margin-top: 12px; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">loading…</div>
  <div id="crosshair">+</div>
  <div id="overlay">
    <div class="box">
      <h1>RUSTCRAFT</h1>
      <p>Click to play</p>
      <p>WASD move &nbsp;·&nbsp; Space jump / swim up &nbsp;·&nbsp; Shift sprint &nbsp;·&nbsp; Mouse look</p>
      <p>F fly (Space/Shift up/down) &nbsp;·&nbsp; Q/E fly speed</p>
      <p>Left click break &nbsp;·&nbsp; Right click place</p>
      <p>Left click break block &nbsp;·&nbsp; Right click place stone &nbsp;·&nbsp; Esc release mouse</p>
      <p class="seed" id="seedline"></p>
    </div>
  </div>
  <script type="module">
    import init from "./pkg/rustcraft_web.js";
    // Show seed in the overlay (the Rust side reads it too).
    const seed = new URLSearchParams(location.search).get("seed") || "1337";
    document.getElementById("seedline").textContent = "world seed: " + seed;
    init().catch((e) => {
      console.error("RustCraft failed to load:", e);
      document.getElementById("overlay").textContent = "Failed to load RustCraft: " + e;
    });
  </script>
</body>
</html>
