[package]
name = "qwencraft-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebGPU (wgpu) voxel renderer for Qwencraft: chunk meshing, voxel lighting, ambient occlusion"

[target.'cfg(target_arch = "wasm32")'.dependencies]
qwencraft-world = { path = "../qwencraft-world" }
qwencraft-server = { path = "../qwencraft-server" }
wgpu = "27.0.1"
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"
web-sys = {
    version = "=0.3.77",
    # "console" is used for the startup/log lines; listed here so this
    # crate builds standalone (a -p qwencraft-client build used to rely on
    # feature unification from qwencraft-web).
    features = ["console", "HtmlCanvasElement", "Navigator", "Window"],
}

# Host-side WGSL validation (tests/wgsl_valid.rs). naga is wgpu's shader
# front-end — the same family Dawn (browser WebGPU) uses — so the shader
# module can be type-checked in `cargo test` without a browser. (naga-rs
# is a hair more lenient than Dawn in one known case: it accepts a
# two-arg `atan(y, x)`, which Dawn rejects — see textures.wgsl. The
# browser tests remain the final authority.)
[dev-dependencies]
naga = { version = "27.0.3", features = ["wgsl-in"] }
